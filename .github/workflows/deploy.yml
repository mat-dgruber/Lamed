name: Update Content and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: 4. Build Angular App
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: 5. Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for authenticating with Google Cloud

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }} # User needs to set this secret
          # OR use Workload Identity Federation (recommended but more setup)

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: lamed-backend
          source: ./backend
          region: southamerica-east1 # Updated to match your actual service region
          project_id: lamed-148
          env_vars: |
            FIREBASE_PROJECT_ID=lamed-148
            YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
            SYNC_TOKEN=${{ secrets.SYNC_TOKEN }}
