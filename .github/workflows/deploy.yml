name: Update Content and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: 4. Build Angular App
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: 5. Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project lamed-148
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="southamerica-east1-docker.pkg.dev/lamed-148/lamed-backend/lamed-backend:${{ github.sha }}"
          IMAGE_LATEST="southamerica-east1-docker.pkg.dev/lamed-148/lamed-backend/lamed-backend:latest"
          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" ./backend
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: lamed-backend
          image: southamerica-east1-docker.pkg.dev/lamed-148/lamed-backend/lamed-backend:${{ github.sha }}
          region: southamerica-east1
          project_id: lamed-148
          env_vars: |
            FIREBASE_PROJECT_ID=lamed-148
            YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
            SYNC_TOKEN=${{ secrets.SYNC_TOKEN }}
            SMTP_SERVER=smtp.gmail.com
            SMTP_PORT=587
            SMTP_USER=lamedchanel@gmail.com
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            NOTIFICATION_EMAIL=matheus.gruber123@gmail.com
