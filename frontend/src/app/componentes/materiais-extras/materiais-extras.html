<div class="container mx-auto px-4 py-8">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-zinc-900 dark:text-zinc-50">
      Estudos Semanais (Materiais Extras)
    </h1>
    <p class="mt-2 text-zinc-600 dark:text-zinc-400">
      Aprofunde-se no estudo bíblico com nossos pacotes completos de estudos.
    </p>
  </div>

  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
    @for (bundle of bundles(); track bundle.id) {
      <app-bundle-card [bundle]="bundle"></app-bundle-card>
    }
  </div>

  @if (bundles().length === 0) {
    <div class="mt-12 text-center text-zinc-500">
      <p>Nenhum estudo encontrado no momento.</p>
    </div>
  }
</div>
