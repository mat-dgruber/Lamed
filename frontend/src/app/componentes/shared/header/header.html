<header class="site-header" [ngClass]="{ 'is-hidden': isHeaderHidden() }">
  <div class="container">
    <div class="logo-area">
      <a routerLink="/" class="logo-link">
        <img
          src="/assets/Imagens/lamed-logo.png"
          alt="Logo Lamed — Plataforma de Estudos Bíblicos"
          class="logo-img"
          loading="eager"
          fetchpriority="high"
          width="50"
          height="50"
        />
        <span class="logo-text">LAMED</span>
      </a>
    </div>
    <nav class="main-nav" [ngClass]="{ active: isMenuOpen() }">
      <ul>
        <li><a routerLink="/" (click)="toggleMenu()">Início</a></li>
        <li class="dropdown" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()" #dropdown>
          <a
            href="/materiais-extras"
            (click)="toggleDropdown($event); $event.preventDefault()"
            class="dropdown-toggle"
            role="button"
            aria-haspopup="true"
            [attr.aria-expanded]="isDropdownOpen()"
            aria-controls="materiais-dropdown"
          >Materiais</a>
          <ul id="materiais-dropdown" class="dropdown-menu" [ngClass]="{ show: isDropdownOpen() }" #dropdownMenu role="menu">
            <li><a routerLink="/videos" (click)="closeMenu()">Vídeos</a></li>
            <li><a routerLink="/artigos" (click)="closeMenu()">Artigos</a></li>
            <li><a routerLink="/materiais-extras" (click)="closeMenu()">Trilhas</a></li>
          </ul>
        </li>
        <li><a routerLink="/apoie" (click)="toggleMenu()">Apoie</a></li>
        <li><a routerLink="/sobre" (click)="toggleMenu()">Sobre</a></li>
        <li><a routerLink="/contato" (click)="toggleMenu()">Contato</a></li>
      </ul>
    </nav>
    <button
      class="menu-toggle"
      (click)="toggleMenu()"
      aria-label="Abrir menu"
      [attr.aria-expanded]="isMenuOpen()"
    >
      <lucide-icon name="menu"></lucide-icon>
    </button>
  </div>
</header>
