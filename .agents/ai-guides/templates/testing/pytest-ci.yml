name: Testes Backend (Pytest)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Instalar dependências
        run: uv sync --all-extras --dev
      - name: Testes com cobertura (falha abaixo de 80%)
        run: uv run pytest tests/ -n auto --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
