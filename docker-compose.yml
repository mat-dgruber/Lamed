services:
  # 🅰️ Angular Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lamed_angular_app
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    # Use polling to ensure file change detection works well inside Docker containers
    command: ng serve --host 0.0.0.0 --poll 1000

  # 🐍 FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lamed_backend_app
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    environment:
      - PORT=8080
      - FIREBASE_PROJECT_ID=lamed-148
      # Optional: add credentials mount or env vars here if needed for local GCP connection
